<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  
</head>
<body>
  <div>
    <table style="float: left; border-spacing: 5px; margin-left: 550px; margin-top: 250px;" >
        <thead>
            <th colspan="3">Ejercicios de tablas</th>
        </thead>
        <tbody>
            <tr>
                <td>A</td>
                <td>B</td>
                <td>C</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
             <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
             <tr>
                <td>7</td>
                <td>8</td>
                <td>9</td>
            </tr>
            <tr>
                <td colspan="3">Apartado A</td>
            </tr>
        </tbody>
    </table>
    <table style="float: right; margin-right: 550px; margin-top: 250px;">
        <thead>
            <th colspan="3">Ejercicios de tablas</th>
        </thead>
        <tbody>
            <tr>
                <td>A</td>
                <td>B</td>
                <td>C</td>
            </tr>
            <tr>
                <td>1</td>
                <td colspan="2">2</td>
               
            </tr>
             <tr>
                <td rowspan="2">4</td>
                <td>5</td>
                <td>6</td>
            </tr>

            <tr>
                <td>8</td>
                <td>9</td>
            </tr>

            <tr>
                <td colspan="3">Apartado B</td>
            </tr>
        </tbody>
    </table>
</div>
    <style>
        table, td{
            border:solid 1px black;
            border-collapse: collapse;
        }
        *{
            text-align: center;
        }
    </style>
</body>
</html>
