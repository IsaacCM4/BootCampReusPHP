<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Colores primarios</h1>
    <div class="primaryColor">
      <div class="circle red"></div>
      <div class="circle green"></div>
      <div class="circle blue"></div>
    </div>
    <h1>Colores secundarios</h1>
    <div class="secondaryColor1">
      <div class="circle red2"></div>
      <p id="p1"><b>+</b></p>
      <div class="circle blue2"></div>
      <p id="p2">=</p>
      <div class="circle pink"></div>
    </div>
    <div class="secondaryColor2">
      <div class="circle blue3"></div>
      <p id="p3"><b>+</b></p>
      <div class="circle green2"></div>
      <p id="p4"><b>=</b></p>
      <div class="circle cyan"></div>
    </div>

    <div class="secondaryColor3">
      <div class="circle green3"></div>
      <p id="p5"><b>+</b></p>
      <div class="circle red3"></div>
      <p id="p6"><b>=</b></p>
      <div class="circle yellow"></div>
    </div>

    <div class="comboColors">
      <div class="circlepro redpro"></div>
      <div class="circlepro greenpro"></div>
      <div class="circlepro bluepro"></div>
    </div>
  </body>
</html>
