<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <link rel="stylesheet" href="stylecalculadora.css" />
</head>
<body>
  <div class="container">
    <div class="calculator">
      <div class="top">
        <span class="title">calc</span>
        <div class="theme">
          <span>THEME</span>
          <div class="theme-switch">
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <div class="dot"></div>
          </div>
        </div>
      </div>
      <div class="display"><p id="numerosEnCalc">0</p></div>
      <div class="buttons">
        <button id="num7">7</button>
        <button id="num8">8</button>
        <button id="num9">9</button>
        <button class="del" id="borrar">DEL</button>
        <button id="num4">4</button>
        <button id="num5">5</button>
        <button id="num6">6</button>
        <button id="sumar">+</button>
        <button id="num1">1</button>
        <button id="num2">2</button>
        <button id="num3">3</button>
        <button id="restar">-</button>
        <button id="decimal">.</button>
        <button id="num0">0</button>
        <button id="dividir">/</button>
        <button id="multiplicar">x</button>
        <button class="reset" id="reset">RESET</button>
        <button class="equal" id="calcular">=</button>
      </div>
    </div>
  </div>
  <script src="calculadora.js"></script>
</body>
</html>
