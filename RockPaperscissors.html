<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="RockPaperscissors.css" />
  </head>
  <body>
    <div id="juego">
        <!--Puntuacion-->
      <div id="puntuaciones">
        <h2 id="puntacionIzquierda">0</h2>
        <h2>-</h2>
        <h2 id="puntacionDrecha">0</h2>
      </div>

      <!--Manos-->
      <div id="manos">
        
        <!--Mano izquierda-->
          <div id="manoIzquierda">
            <img src="./imgRockPaperScissors/puñoIzquierdo.png" alt="" />
          </div>
          
    
       <!--Mano derecha-->
        <div id="manoDerecha">
          <img src="./imgRockPaperScissors/puñoDerecho.png" alt="" />
        </div>
       
      </div>
      <div id="jugadas">
           <button id="piedra"> <img src="./imgRockPaperScissors/puño.png" alt="Jugar"></button>
           <button id="papel"><img src="./imgRockPaperScissors/mano.png" alt="Jugar"></button>
           <button id="tijeras"><img src="./imgRockPaperScissors/manosTijerasIzquierda.png" alt="Jugar"></button>
          </div>
      <div id="opciones">
        <button id="reiniciar">Reiniciar</button>
      </div>
    </div>

    <script src="RockPaperscissors.js"></script>
  </body>
</html>
