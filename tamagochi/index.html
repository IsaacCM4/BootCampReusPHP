<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tamagochi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="general">
      <div id="eat">
        <div id="statsFood">
          <div class="barra" id="foodBar">
            <div class="progreso" id="comida">
              <span id="foodText">Hambre: 70%</span>
            </div>
          </div>
          <img src="./imgtamagochi/zanahoria.png" alt="" id="zanahoriaImg" />
          <p id="cantidadZanahorias">x4</p>
          <img src="./imgtamagochi/regadora.png" alt="" id="regadoraImg" />
          <p id="cantidadRegadoras">x2</p>
        </div>
        <div id="panelControlComida">
          <div id="campoZanahorias">
            <img
              src="./imgtamagochi/zanahoriasPequeñas.png"
              alt=""
              id="campoZanahoriasImg"
            />
            <div id="botonesAccionHuerto">
              <button class="pixel-btn" id="btn-recoger">Recoger</button>
              <button class="pixel-btn" id="btn-regar">Regar</button>
            </div>
          </div>

          <div id="controlesComida">
            <button class="pixel-btn" id="btn-alimentar">Alimentar</button>
            <button class="pixel-btn" id="btn-comprarZanahoria">
              Comprar zanahorias
            </button>
            <button class="pixel-btn" id="btn-comprarRegadora">
              Comprar regadoras
            </button>
          </div>
        </div>
      </div>

      <!-- SECCIÓN: JUEGOS -->
      <div id="play">
        <div id="statsFun">
          <div class="barra" id="funBar">
            <div class="progreso" id="diversion">
              <span id="funText">Diversión: 60%</span>
            </div>
          </div>
          <img src="./imgtamagochi/moneda.png" alt="" id="monedaImg" />
          <p id="cantidadMonedas">x20</p>
        </div>

        <!-- PANEL DE JUEGOS -->
        <div id="panelJuegos">
          <button class="pixel-btn" id="juegoReaccion">
            Juego de Reacción
          </button>
          <button class="pixel-btn" id="juegoClics">Clic Rápido</button>
          <button class="pixel-btn" id="juegoMemoria">Juego de Memoria</button>
        </div>
      </div>

      <!-- OTRAS SECCIONES -->
      <div id="fight">
        <div id="statsStrength">
          <div class="barra" id="strengthBar">
            <div class="progreso" id="strength">
              <span id="strengthText">Level: 1</span>
            </div>
          </div>
          <img src="./imgtamagochi/guanteBoxeo.png" alt=""><p id="numGolpes">x0</p>
        </div>

        <div id="panelControlFuerza">
      
            <img src="./imgtamagochi/punchingBag.png" alt="" id="sacoBoxeoIMG">
  
          <div id="botonesFuerza" >
            <button id="MejorarGuante" class="pixel-btn">Mejorar guante</button>

          </div>
        </div>

      </div>
      <div id="room">
      <div id="statsEnergy">
        <div class="barra" id="energyBar">
            <div class="progreso" id="energy">
              <span id="energyText">Energy: 60%</span>
            </div>
          </div>
        </div>
        <div id="panelDormitorio">
           <div id="overlay"></div>
            <img src="./imgtamagochi/lampara.png" alt="" id="lampara">
        </div>
         
        </div>
      </div>

      <!-- TAMAGOCHI CENTRAL -->
      <img
        id="tamagochi-gif"
        src="imgtamagochi/gifGatito.gif"
        alt="Tamagochi"
      />
    </div>

    <!-- BARRA DE EXPERIENCIA -->
    <div class="barra" id="xpBar">
      <div class="progreso" id="xp"></div>
    </div>

    <!-- ZONA DEL MINIJUEGO (oculta al inicio) -->
    <div id="zonaMinijuego" class="oculto">
      <h3 id="tituloMinijuego"></h3>
      <div id="contenedorMinijuego"></div>
      <button class="pixel-btn" id="volverTamagochi">Volver</button>
    </div>

    <script src="tamagochi.js"></script>
  </body>
</html>
