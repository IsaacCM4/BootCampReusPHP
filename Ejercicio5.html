<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #numTel:valid{
            color: green;
        }
        #numTel:invalid{
            color:red;
        }
    </style>
</head>
<body>
    <h1>Validación de télefono mediante a expresiones regulares</h1>
    <input type="text" id="numTel" name="numTel" placeholder="Enter 9 digits of your phone" pattern="[0-9]{9}"><br> <br>
    <input type="submit" value="submit">
</body>
</html>
