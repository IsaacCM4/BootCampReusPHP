<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patatas fritas</title>
</head>
<body>
    <h1>Patatas Fritas</h1>
    <p>Receta de patatas fritas caseras.</p>
    <img src="./img/PatatasFritas.png" alt="Patatas Fritas" title="Patatas Fritas">
<br>

<h2>Ingredientes</h2>
<ul>
    <li>3 o 4 patatas (300g)</li>
    <li>4 dientes de ajo</li>
    <li>Aceite de oliva</li>
    <li>Sal</li>
</ul>
<br>
<h2>Elaboracion (Pasos)</h2>

<ol type="1">
    <li>Calentar aceite en una sartén.</li>
    <li>Añadir las patatas cortas, la sal y los ajos.</li>
    <li>Freír al gusto.</li>
    <li>Servir en plato.</li>
</ol>

</body>
</html>
